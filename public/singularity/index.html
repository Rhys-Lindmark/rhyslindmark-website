<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Today is Day N of the singularity. Counting from January 1, 2026.">
  <link rel="canonical" href="https://ai.rhyslindmark.com/singularity">
  <title>Day of the singularity</title>
  <style>
    :root { color-scheme: light; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: #1a1a1a; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; text-align: center; }
    h1 { max-width: 22ch; margin: 0; font-size: clamp(2.25rem, 7vw, 5rem); line-height: 1.15; font-weight: 400; text-wrap: balance; }
    #day { font-variant-numeric: tabular-nums; }
    h1 a { color: inherit; text-decoration-thickness: .04em; text-underline-offset: .12em; }
    h1 a:hover { text-decoration-color: #888; }
    .year { margin: 1.25rem 0 0; font-size: clamp(1.25rem, 3vw, 1.75rem); color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>Today is <a href="https://x.com/a16z/status/2109396266585334038">Day <span id="day">…</span></a> of the singularity.</h1>
    <p class="year">Year <span id="year">…</span></p>
    <noscript><p>Enable JavaScript to see today’s count.</p></noscript>
  </main>
  <script>
    // Local calendar dates, converted to UTC for arithmetic unaffected by DST.
    function singularityCount(now) {
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      return {
        day: Math.floor((today - Date.UTC(2026, 0, 1)) / 86400000) + 1,
        year: now.getFullYear() - 2025
      };
    }
    const counter = document.getElementById('day');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let today, offset = 0, frame = 0, live = false, lastX, lastY, previousTime;
    const show = value => { counter.textContent = String(Math.max(1, Math.round(value))); };
    function update() {
      const { day, year } = singularityCount(new Date());
      today = day;
      document.getElementById('year').textContent = String(year);
      document.title = `Day ${day} of the singularity`;
      counter.setAttribute('aria-label', String(day));
      if (live && !frame) show(today);
    }
    function settle(time) {
      const elapsed = previousTime === undefined ? 1000 / 60 : Math.min(100, time - previousTime);
      previousTime = time;
      offset *= Math.pow(.94, elapsed / (1000 / 60));
      if (Math.abs(offset) < .5) {
        offset = 0; frame = 0; previousTime = undefined; show(today); return;
      }
      show(today + offset);
      frame = requestAnimationFrame(settle);
    }
    function countUp() {
      const start = performance.now();
      show(1);
      function tick(time) {
        if (reduce.matches) { live = true; show(today); return; }
        const progress = Math.min(1, (time - start) / 2600);
        show(1 + (today - 1) * (1 - Math.pow(1 - progress, 2.2)));
        if (progress < 1) requestAnimationFrame(tick);
        else { live = true; show(today); }
      }
      requestAnimationFrame(tick);
    }
    // Moving up/right raises the count; down/left lowers it. At rest it
    // eases back to the real date, just like Part 3's scroll interaction.
    addEventListener('pointermove', event => {
      const dx = lastX === undefined ? 0 : event.clientX - lastX;
      const dy = lastY === undefined ? 0 : event.clientY - lastY;
      lastX = event.clientX; lastY = event.clientY;
      if (!live || reduce.matches || event.pointerType === 'touch') return;
      offset = Math.max(-180, Math.min(180, offset + (dx - dy) * .25));
      show(today + offset);
      if (!frame && offset) frame = requestAnimationFrame(settle);
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => { lastX = lastY = undefined; });
    reduce.addEventListener('change', () => {
      if (reduce.matches) {
        cancelAnimationFrame(frame); frame = 0; offset = 0;
        previousTime = undefined; live = true; show(today);
      }
    });
    update();
    if (reduce.matches) { live = true; show(today); } else countUp();
    setInterval(update, 1000);
    document.addEventListener('visibilitychange', update);
  </script>
</body>
</html>
