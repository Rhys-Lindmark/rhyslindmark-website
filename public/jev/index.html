<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="description" content="Check a claim against a source passage using Jev."><title>Claim Check</title><link rel="canonical" href="https://ai.rhyslindmark.com/jev/"><link rel="stylesheet" href="/jev/minimal.css?v=compact-1"></head>
<body><div class="shell"><header><a href="/">Rhys / AI</a><h1>Claim Check</h1></header>
<main>
<div class="workspace"><section class="editor"><div class="section-heading"><h2>Input</h2><button id="clear" type="button" class="text-button">Clear</button></div><form id="check-form"><label for="claim">Claim <span id="claim-count">0 / 1,500</span></label><textarea id="claim" name="claim" maxlength="1500" rows="2" required></textarea><label for="evidence">Evidence <span id="evidence-count">0 / 10,000</span></label><textarea id="evidence" name="evidence" maxlength="10000" rows="5" required></textarea><div class="examples"><span>Examples:</span><button type="button" data-example="0">Supported</button><button type="button" data-example="1">Insufficient evidence</button><button type="button" data-example="2">Contradicted</button></div><div class="actions"><div id="human-check"></div><button class="run" type="submit" id="run" disabled>Check</button></div><p id="error" role="alert" hidden></p></form></section>
<section class="results" aria-labelledby="result-title" aria-busy="false"><div class="section-heading"><h2 id="result-title">Result</h2><span id="status"></span></div><div id="empty"></div><div id="output" hidden aria-live="polite"><h3 id="verdict"></h3><div class="distribution"><h4>Probabilities</h4><div id="bars"></div></div><div class="signals"><div><span>Addresses the claim</span><strong id="direct"></strong></div><div><span>Overreach detected</span><strong id="overreach"></strong></div></div><div class="confidence"><span>Model confidence</span><strong id="confidence"></strong></div><div class="result-footer"><span id="meta"></span><button type="button" id="copy" class="text-button">Copy result</button></div></div><p class="note">Checks the supplied passage, not the source’s accuracy. Probabilities are model estimates. Your text is sent to TypeSafe.</p></section></div>
</main><footer><a href="https://docs.typesafe.ai/">Jev documentation</a></footer></div><script type="module" src="/jev/app.js?v=compact-1"></script></body></html>
