name = "rhyslindmark-website"
compatibility_date = "2026-07-20"
compatibility_flags = ["enable_request_signal"]
pages_build_output_dir = "dist"

[vars]
RHYSBOT_MODAL_URL = "https://rhys-lindmark--rhysbot-serving-api.us-east.modal.run"
RHYSBOT_TURNSTILE_SITE_KEY = "0x4AAAAAAFbFqVlmDZgVCLAG"
RHYSBOT_ENABLED_MODELS = "qwen,nanochat"
RHYSBOT_TRAIN_SANDBOX_QUOTA = "1"
RHYSBOT_PLATFORM_URL = "https://rhys-lindmark--rhysbot-platform-api.us-east.modal.run"
RHYSBOT_VOICE_STREAM_URL = "https://rhys-lindmark--rhysbot-pocket-voice-v4-pocketvoice-api.us-east.modal.run"
RHYSBOT_CPU_STANDBY_ENABLED = "1"
RHYSBOT_CPU_STANDBY_SINCE = "2026-10-20T03:10:00Z"
RHYSBOT_TRAIN_BRIDGE_URL = "https://rhys-lindmark--rhysbot-platform-api.us-east.modal.run"

[ai]
binding = "AI"

[[d1_databases]]
binding = "RHYSBOT_DB"
database_name = "rhysbot-platform"
database_id = "c2f5b3ad-87cd-4e17-9e07-da810454a53c"

[[d1_databases]]
binding = "RHYSBOT_TRAIN_DB"
database_name = "rhysbot-platform"
database_id = "c2f5b3ad-87cd-4e17-9e07-da810454a53c"
